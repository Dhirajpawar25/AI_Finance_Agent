# AI Financial Assistant — Fly.io config
# Deploy:  fly launch --no-deploy → fly volumes create sqlite_data --size 1 → fly deploy
# Secrets: fly secrets set TELEGRAM_BOT_TOKEN=... GEMINI_API_KEY=... (see README)

app = "ai-financial-agent"

kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

# App defaults — secrets (tokens, OAuth) are set via `fly secrets set`
[env]
  USE_WEBHOOK = "true"
  DATA_DIR = "/data"
  DATABASE_URL = "sqlite:////data/financial_agent.db"
  PYTHONUNBUFFERED = "1"

# Keep the app always running so daily briefings fire on time
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent storage for SQLite + uploaded documents (survives redeploys)
[[mounts]]
  source = "sqlite_data"
  destination = "/data"